# minSdkVersion=26 because VisionCamera/Nitro wrap camera frames as
# HardwareBuffers, whose NDK APIs (AHardwareBuffer_*) require API 26.
# MediaPipe Tasks Vision only needs 24; 26 is the HardwareBuffer floor.
# These "VisionCameraHandLandmarker_*" values are only used as fallbacks
# when this module is built standalone; the deskos app itself sets its own
# via rootProject.ext in android/build.gradle, which wins.
VisionCameraHandLandmarker_kotlinVersion=2.1.20
VisionCameraHandLandmarker_minSdkVersion=26
VisionCameraHandLandmarker_targetSdkVersion=35
VisionCameraHandLandmarker_compileSdkVersion=34
VisionCameraHandLandmarker_ndkVersion=27.1.12297006
